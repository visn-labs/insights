[package]
name = "visn-phase0"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Phase 0 video analytics pipeline and local test UI"
license = "Proprietary"

[features]
default = []
kafka = ["dep:rdkafka"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["multipart", "macros"] }
base64 = "0.22"
bytes = "1.10"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rdkafka = { version = "0.37", optional = true, features = ["cmake-build", "ssl-vendored", "zstd"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.46", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.16", features = ["serde", "v5", "v7"] }
